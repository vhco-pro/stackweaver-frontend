server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx runs behind a TLS-terminating ingress and listens on 8080, so any
    # redirect it builds from its own scheme and port points at
    # http://<host>:8080, which is unreachable from the browser. Emit relative
    # Location headers so a redirect always stays on the public origin.
    absolute_redirect off;

    # Operator-owned identity and indexing settings. The generic image defaults
    # to noindex; publishing requires an explicit HTTPS site URL.
    include /etc/nginx/public-site-settings.conf;
    sub_filter_once off;
    sub_filter_types application/xml text/plain;
    sub_filter '__SW_SITE_URL__' $sw_site_url;
    sub_filter '__SW_BASE_PATH__' $sw_base_path;
    sub_filter '__SW_SITEMAP_LINE__' $sw_sitemap_line;

    # Security headers. nginx drops inherited add_header directives from any
    # level that sets its own, so this snippet is re-included inside every
    # location below that declares an add_header. See security-headers.conf.
    include /etc/nginx/security-headers.conf;

    # Optional extra locations, for a deployment with no ingress in front of it. The Docker
    # Compose example mounts a snippet here that proxies the API's paths to the API, so the
    # browser stays on one origin, which the connect-src 'self' policy above requires. The image
    # installs nothing there, and a glob that matches nothing is not an error.
    include /etc/nginx/stackweaver.d/*.conf;

    # Known interactive routes are derived from appRoutes at build time. Unknown
    # public URLs must not receive successful application HTML.
    include /etc/nginx/public-private-routes.conf;
    error_page 404 /404.html;
    location = /404.html { internal; }
    location = /app-shell.html { internal; }
    location ^~ /_site/ { internal; }
    location ~ ^/(?:internal-docs|__dev|\.tmp)(?:/|$) { return 404; }
    location = /internal-docs-index.json { return 404; }
    location = /internal-docs-search-index.json { return 404; }
    location = /landing { return 308 $sw_base_path/$is_args$args; }
    location = /index.html { return 308 $sw_base_path/$is_args$args; }
    location = / { try_files /_site/index.html =404; }
    location / {
        if ($uri ~ "^(.+)/$") { return 308 $sw_base_path$1$is_args$args; }
        try_files /_site$uri.html $uri =404;
    }

    # Crawler endpoints are files, never application routes. A deployment without
    # a generated sitemap must return 404 rather than a successful HTML shell.
    location = /robots.txt {
        types { }
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        if ($sw_site_url = "") { return 404; }
        if ($sw_noindex != "") { return 404; }
        types { }
        default_type application/xml;
        charset utf-8;
        try_files $uri =404;
    }

    # Unknown asset extensions and extensionless asset URLs must not reach the
    # SPA fallback. Known extensions still use the cache rule below.
    location /assets/ {
        try_files $uri =404;
    }

    # Runtime config - deployment-specific (client_id, API URL). Must never be
    # cached, otherwise a cluster reinstall serves a stale config. An exact-match
    # location takes precedence over the static-asset regex below, so env.js is
    # not caught by the 1y immutable cache.
    location = /env.js {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Cache static assets (single Cache-Control header - `expires` would emit a
    # second, redundant one)
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        # Cache successful files only. A missing file must not be cached for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Health check
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
        include /etc/nginx/security-headers.conf;
    }

    # Limit request body size
    client_max_body_size 10m;
}
