server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. nginx drops inherited add_header directives from any
    # level that sets its own, so this snippet is re-included inside every
    # location below that declares an add_header. See security-headers.conf.
    include /etc/nginx/security-headers.conf;

    # SPA fallback — serve index.html for all routes (inherits the headers above)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime config — deployment-specific (client_id, API URL). Must never be
    # cached, otherwise a cluster reinstall serves a stale config. An exact-match
    # location takes precedence over the static-asset regex below, so env.js is
    # not caught by the 1y immutable cache.
    location = /env.js {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Cache static assets (single Cache-Control header — `expires` would emit a
    # second, redundant one)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    # Health check
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
        include /etc/nginx/security-headers.conf;
    }

    # Limit request body size
    client_max_body_size 10m;
}
