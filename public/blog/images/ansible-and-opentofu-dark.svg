    <text x="56" y="116" font-size="31" fill="#e2e8f0" font-weight="650" letter-spacing="-.8">Two tools. A shared place to work.</text>
    <rect x="56" y="158" width="372" height="170" rx="20" fill="#18243d" stroke="#334464" stroke-width="2"/><rect x="472" y="158" width="372" height="170" rx="20" fill="#18243d" stroke="#334464" stroke-width="2"/>
