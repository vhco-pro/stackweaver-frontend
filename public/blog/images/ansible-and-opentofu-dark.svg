    <text x="83" y="237" font-size="23" fill="#e2e8f0" font-weight="600">Playbook + inventory</text>
    <text x="83" y="279" font-size="18" fill="#9bacc8" >Run a job. Inspect its tasks.</text>
    <text x="499" y="237" font-size="23" fill="#e2e8f0" font-weight="600">Configuration + state</text>
    <text x="499" y="279" font-size="18" fill="#9bacc8" >Review a plan. Confirm the apply.</text>
