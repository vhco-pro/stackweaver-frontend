<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">Ansible jobs and OpenTofu workspaces in one platform</title><defs><linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect width="900" height="440" rx="26" fill="#0e172b"/><g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
