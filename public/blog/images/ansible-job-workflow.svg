<svg xmlns="http://www.w3.org/2000/svg" width="640" height="850" viewBox="0 0 640 850" role="img" aria-labelledby="title desc"><title id="title">From Git to a scheduled Ansible job</title><desc id="desc">Register a playbook and inventory, create a reusable job template, check a manual run and then configure its schedule.</desc><rect width="640" height="850" rx="24" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0369a1"/></marker></defs><rect x="24" y="24" width="592" height="164" rx="18" fill="#ffffff" stroke="#cbd5e1"/><text x="48" y="60" fill="#0369a1" font-family="system-ui,sans-serif" font-size="20" font-weight="700">01</text><text x="48" y="102" fill="#0f172a" font-family="system-ui,sans-serif" font-size="28" font-weight="650">Keep the inputs in Git</text><text x="48" y="139" fill="#475569" font-family="system-ui,sans-serif" font-size="22">playbooks/hello.yml</text><text x="48" y="169" fill="#475569" font-family="system-ui,sans-serif" font-size="22">inventory/demo.yml</text><path d="M320 198 V222" stroke="#0369a1" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="232" width="592" height="164" rx="18" fill="#ffffff" stroke="#cbd5e1"/><text x="48" y="268" fill="#0369a1" font-family="system-ui,sans-serif" font-size="20" font-weight="700">02</text><text x="48" y="310" fill="#0f172a" font-family="system-ui,sans-serif" font-size="28" font-weight="650">Create the job template</text><text x="48" y="347" fill="#475569" font-family="system-ui,sans-serif" font-size="22">Use the registered playbook</text><text x="48" y="377" fill="#475569" font-family="system-ui,sans-serif" font-size="22">and its synced inventory.</text><path d="M320 406 V430" stroke="#0369a1" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="440" width="592" height="164" rx="18" fill="#ffffff" stroke="#cbd5e1"/><text x="48" y="476" fill="#0369a1" font-family="system-ui,sans-serif" font-size="20" font-weight="700">03</text><text x="48" y="518" fill="#0f172a" font-family="system-ui,sans-serif" font-size="28" font-weight="650">Check a manual run</text><text x="48" y="555" fill="#475569" font-family="system-ui,sans-serif" font-size="22">Find the greeting in the output.</text><text x="48" y="585" fill="#475569" font-family="system-ui,sans-serif" font-size="22">Confirm the successful recap.</text><path d="M320 614 V638" stroke="#0369a1" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="648" width="592" height="164" rx="18" fill="#ffffff" stroke="#cbd5e1"/><text x="48" y="684" fill="#0369a1" font-family="system-ui,sans-serif" font-size="20" font-weight="700">04</text><text x="48" y="726" fill="#0f172a" font-family="system-ui,sans-serif" font-size="28" font-weight="650">Set the schedule</text><text x="48" y="763" fill="#475569" font-family="system-ui,sans-serif" font-size="22">Choose a timezone explicitly.</text><text x="48" y="793" fill="#475569" font-family="system-ui,sans-serif" font-size="22">Inspect the next run.</text></svg>
