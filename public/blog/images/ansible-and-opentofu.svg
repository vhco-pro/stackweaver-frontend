<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">Ansible jobs and OpenTofu workspaces in one platform</title><defs><linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><rect width="900" height="440" rx="26" fill="#f3f6fd"/><g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="56" y="62" font-size="12" fill="#526580" letter-spacing="2" font-weight="600">STACKWEAVER / ONE SHARED APPLICATION</text>
    <text x="56" y="116" font-size="31" fill="#172554" font-weight="650" letter-spacing="-.8">Two tools. A shared place to work.</text>
    <rect x="56" y="158" width="372" height="170" rx="20" fill="#ffffff" stroke="#c2d0e9" stroke-width="2"/><rect x="472" y="158" width="372" height="170" rx="20" fill="#ffffff" stroke="#c2d0e9" stroke-width="2"/>
    <text x="83" y="196" font-size="12" fill="#526580" letter-spacing="2" font-weight="600">ANSIBLE JOB</text><text x="499" y="196" font-size="12" fill="#526580" letter-spacing="2" font-weight="600">OPENTOFU WORKSPACE</text>
    <text x="83" y="237" font-size="23" fill="#172554" font-weight="600">Playbook + inventory</text>
    <text x="83" y="279" font-size="18" fill="#526580" >Run a job. Inspect its tasks.</text>
    <text x="499" y="237" font-size="23" fill="#172554" font-weight="600">Configuration + state</text>
    <text x="499" y="279" font-size="18" fill="#526580" >Review a plan. Confirm the apply.</text>
    <path d="M242 328v34h416v-34M450 362v21" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text x="292" y="411" font-size="12" fill="#526580" letter-spacing="2" font-weight="600">A SHARED VIEW FOR THE TEAM</text></g></svg>
