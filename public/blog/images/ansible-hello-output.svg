<svg xmlns="http://www.w3.org/2000/svg" width="640" height="490" viewBox="0 0 640 490" role="img" aria-labelledby="title desc"><title id="title">Verified hello job result</title><desc id="desc">Selected fields from the tested Stackweaver job: localhost returns Hello from Stackweaver, with one successful task, no changes, no failures and no unreachable hosts. This is an illustrated excerpt of the recorded runner result.</desc><rect width="640" height="490" rx="20" fill="#f8fafc"/><rect x="12" y="12" width="616" height="466" rx="16" fill="#ffffff" stroke="#cbd5e1"/><text x="32" y="52" fill="#1e293b" font-size="25" font-family="system-ui,sans-serif">Verified job result</text><text x="32" y="83" fill="#475569" font-size="19" font-family="system-ui,sans-serif">Selected fields from the recorded runner events</text><path d="M32 102H608" stroke="#cbd5e1"/><text x="32" y="144" fill="#475569" font-size="22" font-family="system-ui,sans-serif">Show the greeting</text><text x="32" y="181" fill="#1e293b" font-size="22" font-family="system-ui,sans-serif">localhost</text><text x="32" y="226" fill="#166534" font-size="28" font-family="system-ui,sans-serif">Hello from Stackweaver</text><path d="M32 256H608" stroke="#cbd5e1"/><text x="32" y="296" fill="#475569" font-size="22" font-family="system-ui,sans-serif">Host recap: localhost</text><text x="32" y="343" fill="#166534" font-size="30" font-family="system-ui,sans-serif">1</text><text x="74" y="343" fill="#1e293b" font-size="22" font-family="system-ui,sans-serif">successful</text><text x="330" y="343" fill="#166534" font-size="30" font-family="system-ui,sans-serif">0</text><text x="372" y="343" fill="#1e293b" font-size="22" font-family="system-ui,sans-serif">changed</text><text x="32" y="418" fill="#166534" font-size="30" font-family="system-ui,sans-serif">0</text><text x="74" y="418" fill="#1e293b" font-size="22" font-family="system-ui,sans-serif">failed</text><text x="330" y="418" fill="#166534" font-size="30" font-family="system-ui,sans-serif">0</text><text x="372" y="418" fill="#1e293b" font-size="22" font-family="system-ui,sans-serif">unreachable</text></svg>
