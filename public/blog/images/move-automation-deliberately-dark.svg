<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">Keep automation in Git and move platform configuration deliberately</title><defs><linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect width="900" height="440" rx="26" fill="#0e172b"/><g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="56" y="62" font-size="12" fill="#9bacc8" letter-spacing="2" font-weight="600">MOVING TO STACKWEAVER</text>
    <text x="56" y="116" font-size="31" fill="#e2e8f0" font-weight="650" letter-spacing="-.8">Keep the automation. Move with care.</text>
    <rect x="56" y="159" width="270" height="208" rx="20" fill="#18243d" stroke="#334464" stroke-width="2"/><text x="82" y="197" font-size="12" fill="#9bacc8" letter-spacing="2" font-weight="600">AUTOMATION IN GIT</text>
    <circle cx="105" cy="236" r="7" fill="#60a5fa"/><circle cx="105" cy="282" r="7" fill="#60a5fa"/>
    <circle cx="144" cy="258" r="7" fill="#a78bfa"/>
    <path d="M105 243v32m7 -35 25 15" stroke="#60a5fa" stroke-width="2" fill="none"/>
    <text x="82" y="328" font-size="19" fill="#9bacc8" >Keep your repository.</text>
    <rect x="370" y="159" width="474" height="208" rx="20" fill="#18243d" stroke="#334464" stroke-width="2"/><text x="397" y="197" font-size="12" fill="#9bacc8" letter-spacing="2" font-weight="600">PLATFORM CONFIGURATION</text>
    <text x="397" y="240" font-size="22" fill="#e2e8f0" font-weight="600">Recreate settings and access.</text>
    <text x="397" y="277" font-size="22" fill="#e2e8f0" font-weight="600">Check execution and credentials.</text>
    <text x="397" y="328" font-size="19" fill="#9bacc8" >Switch ownership after verification.</text>
    <text x="56" y="411" font-size="12" fill="#9bacc8" letter-spacing="2" font-weight="600">ONE DESTINATION OWNS THE RUNS AND SCHEDULES</text></g></svg>
