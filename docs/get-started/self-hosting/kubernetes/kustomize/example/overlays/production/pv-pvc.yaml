# Static provisioning for ReadWriteMany volumes using Azure Blob CSI driver.
# Uses managed identity of the cluster for authentication — no explicit clientID needed (driver >= v1.24).
# https://github.com/kubernetes-sigs/blob-csi-driver/tree/master/deploy/example/blobfuse-mi
#
# Replace the following placeholders before applying:
#   <STORAGE_ACCOUNT>              — Azure storage account name (e.g. mystorageaccount)
#   <RESOURCE_GROUP>               — Resource group containing the storage account (e.g. my-cluster-rg)
#   <RUNNER_WORKSPACES_CONTAINER>  — Blob container name for runner workspaces (e.g. stackweaver-runner-workspaces)
#   <ZITADEL_PAT_CONTAINER>        — Blob container name for Zitadel PAT storage (e.g. stackweaver-zitadel-pat)
#
# For other storage providers (AWS EFS, NFS, etc.) replace the csi block with the appropriate
# driver configuration. The PVC names (runner-workspaces-pvc, zitadel-pat-pvc) must stay the same
# to match the values referenced in values.yaml.

# ── Runner Workspaces ─────────────────────────────────────────────────────────

apiVersion: v1
kind: PersistentVolume
metadata:
  name: runner-workspaces-pv
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 10Gi
  persistentVolumeReclaimPolicy: Retain
  storageClassName: "" # Static provisioning — must be empty
  csi:
    driver: blob.csi.azure.com
    volumeAttributes:
      storageAccount: <STORAGE_ACCOUNT>
      containerName: <RUNNER_WORKSPACES_CONTAINER>
    volumeHandle: "<RESOURCE_GROUP>#<STORAGE_ACCOUNT>#<RUNNER_WORKSPACES_CONTAINER>"
  mountOptions:
    - -o allow_other
    - --file-cache-timeout-in-seconds=120
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runner-workspaces-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: "" # Static provisioning — must be empty
  volumeName: runner-workspaces-pv

# ── Zitadel PAT ───────────────────────────────────────────────────────────────

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: zitadel-pat-pv
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 1Mi
  persistentVolumeReclaimPolicy: Retain
  storageClassName: "" # Static provisioning — must be empty
  csi:
    driver: blob.csi.azure.com
    volumeAttributes:
      storageAccount: <STORAGE_ACCOUNT>
      containerName: <ZITADEL_PAT_CONTAINER>
    volumeHandle: "<RESOURCE_GROUP>#<STORAGE_ACCOUNT>#<ZITADEL_PAT_CONTAINER>"
  mountOptions:
    - -o allow_other
    - --file-cache-timeout-in-seconds=120
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zitadel-pat-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Mi
  storageClassName: "" # Static provisioning — must be empty
  volumeName: zitadel-pat-pv
