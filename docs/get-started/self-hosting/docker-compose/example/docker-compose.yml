# StackWeaver - Production Docker Compose
# Uses pre-built container images from GHCR (no source code required).
#
# Quick start (the same commands as the guide, README.md one level up):
#   cp .env.example .env
#   cp sso.env.example sso.env
#   cp vcs.env.example vcs.env
#   cp oidc.env.example oidc.env
#   sed -i.bak "s|^OIDC_SIGNING_KEY=.*|OIDC_SIGNING_KEY=$(openssl genrsa 2048 | openssl base64 -A)|" oidc.env
#   sed -i.bak "s/^ENCRYPTION_KEY=.*/ENCRYPTION_KEY=$(openssl rand -hex 32)/" .env
#   rm -f oidc.env.bak .env.bak
#   docker compose up -d
# Then follow zitadel-init (docker compose logs -f zitadel-init) and open http://localhost:5173.

# Single user-defined bridge network. Services reach each other by Docker DNS
# service name (postgres, redis, garage, zitadel, api, ...), and only the three
# host-facing ports are published, so the stack behaves the same on Linux, macOS
# and Windows and no internal service is exposed on the host interface.
networks:
  stackweaver:
    driver: bridge

volumes:
  postgres_data:
  garage_data:
  garage_meta:
  runner-workspaces:
  ansible-workspaces:  # isolated from the OpenTofu runner so neither can read the other's staged credentials
  zitadel-pat:

services:

  # ── Infrastructure ──────────────────────────────────────────────────

  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iac_password}
      POSTGRES_DB: ${POSTGRES_DB:-iac_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iac} -d ${POSTGRES_DB:-iac_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [stackweaver]

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [stackweaver]

  garage:
    image: dxflrs/garage:v2.4.1
    container_name: garage
    restart: unless-stopped
    volumes:
      - garage_data:/var/lib/garage/data
      - garage_meta:/var/lib/garage/meta
      - ./garage.toml:/etc/garage.toml:ro
    networks: [stackweaver]

  garage-init:
    image: alpine:3.24
    container_name: garage-init
    depends_on:
      garage:
        condition: service_started
    restart: "no"
    networks: [stackweaver]
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        KEY_ID="$${STORAGE_ACCESS_KEY}"
        KEY_SECRET="$${STORAGE_SECRET_KEY}"

        # Download Garage CLI binary
        ARCH=$$(uname -m)
        wget -qO /usr/local/bin/garage \
          "https://garagehq.deuxfleurs.fr/_releases/v2.4.1/$${ARCH}-unknown-linux-musl/garage"
        chmod +x /usr/local/bin/garage

        # Wait for Garage RPC
        echo "Waiting for Garage..."
        until garage status 2>/dev/null | grep -qi "Hostname"; do sleep 1; done
        echo "Garage is ready"

        # Get node ID
        NODE_ID=$$(garage status 2>/dev/null | grep -v "^=\|^ID" | head -1 | awk '{print $$1}')

        # Assign layout if not yet configured
        CURRENT_VER=$$(garage layout show 2>/dev/null \
          | grep "Current cluster layout version:" | awk '{print $$NF}' || echo "0")
        if [ "$${CURRENT_VER}" = "0" ]; then
          garage layout assign -z dc1 -c 1G "$${NODE_ID}"
          garage layout apply --version 1
        fi

        # Import key, create bucket, grant access (all idempotent)
        garage key import --yes -n stackweaver "$${KEY_ID}" "$${KEY_SECRET}" 2>/dev/null || true
        garage bucket create stackweaver 2>/dev/null || true
        garage bucket allow --read --write --owner stackweaver --key "$${KEY_ID}" 2>/dev/null || true

        echo "Garage initialized successfully"
    environment:
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-GK000000000000000000000000}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789}

  # ── Authentication ──────────────────────────────────────────────────

  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    container_name: zitadel
    restart: unless-stopped
    # tlsMode decides the scheme of the issuer Zitadel puts in every token. `disabled` serves
    # plain HTTP, which is right for http://localhost:8080 and matches ZITADEL_ISSUER, so the API
    # accepts the tokens. Behind a reverse proxy that terminates TLS, set ZITADEL_TLS_MODE=external
    # in .env (together with ExternalSecure in zitadel-defaults.yaml and an https ZITADEL_ISSUER).
    command: >
      start-from-init
      --config /etc/zitadel/defaults.yaml
      --steps /etc/zitadel/init-steps.yaml
      --masterkey "${ZITADEL_MASTERKEY:-LfcvxoyK4yAwsyp5WYeA3siK61yl7064}"
      --tlsMode ${ZITADEL_TLS_MODE:-disabled}
    env_file:
      - ./.env
    environment:
      ZITADEL_SERVICE_USER_TOKEN: ${ZITADEL_LOGIN_SERVICE_USER_TOKEN:-}
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      # The login UI is the Stackweaver SPA, served from
      # the frontend container on port 5173. Zitadel's LoginV2.BaseURI
      # points at the SPA's /login route; LoginV2 origin must match the
      # SPA's origin for CORS/CSP to line up.
      ZITADEL_LOGIN_UI_BASE_URL: ${ZITADEL_LOGIN_UI_BASE_URL:-http://localhost:5173/login}
      ZITADEL_LOGIN_UI_ORIGIN: ${ZITADEL_LOGIN_UI_ORIGIN:-http://localhost:5173}
    volumes:
      - ./zitadel-defaults.yaml:/etc/zitadel/defaults.yaml:ro
      - ./zitadel-init-steps.yaml:/etc/zitadel/init-steps.yaml:ro
      - zitadel-pat:/pat
    user: "0"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [stackweaver]
    ports:
      - "8080:8080"  # published: the browser hits the OIDC issuer/authorize/discovery endpoints

  # No separate login UI container runs: the login pages are part of the
  # Stackweaver SPA, and the auth proxy in the API container (`/auth/*`
  # routes) handles all Zitadel session API calls and OIDC endpoint
  # forwarding. zitadel-init below provisions the `login-ui-service`
  # Zitadel machine user and its PAT, which the auth proxy, the TOTP
  # service and the Zitadel webhook handler in the API container consume
  # through the env var ZITADEL_LOGIN_SERVICE_USER_TOKEN.

  # zitadel-init also configures Zitadel's email provider and login policy from the SMTP_* and
  # STACKWEAVER_SELF_REGISTRATION values in sso.env. The API and zitadel-init both run in email
  # mode (STACKWEAVER_NOTIFICATION_MODE unset): auth codes are only ever delivered by Zitadel.
  zitadel-init:
    image: ghcr.io/vhco-pro/stackweaver-zitadel-init:latest
    container_name: zitadel-init
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - ./.env
      - ./sso.env
    environment:
      # ZITADEL_ISSUER is the OIDC issuer URL the SPA points at. It has
      # no path suffix: the Stackweaver SPA serves login at `/login/*`.
      ZITADEL_ISSUER: ${ZITADEL_ISSUER:-http://localhost:8080}
      ZITADEL_INTERNAL_ADDR: zitadel:8080
      ZITADEL_DOMAIN: ${ZITADEL_EXTERNAL_HOST:-localhost}
      PROJECT_ROOT: /config
      ZITADEL_ADMIN_USERNAME: admin@ZITADEL.localhost
      ZITADEL_ADMIN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:-Password1!}
      ZITADEL_PAT_PATH: /pat/admin.pat
      ZITADEL_PAT: ${ZITADEL_PAT:-}
      ZITADEL_CUSTOM_DOMAINS: ${ZITADEL_CUSTOM_DOMAINS:-}
    volumes:
      - .:/config/deploy
      - zitadel-pat:/pat:ro
    depends_on:
      zitadel:
        condition: service_started
    restart: "no"
    networks: [stackweaver]

  # ── Application ─────────────────────────────────────────────────────

  api:
    image: ghcr.io/vhco-pro/stackweaver-api:latest
    container_name: api
    restart: unless-stopped
    env_file:
      - ./.env
      - ./sso.env
      - ./vcs.env
      - ./oidc.env
    environment:
      # No CONFIG_PATH is set: everything the API needs is supplied below, so it runs in the same
      # environment-only mode as the Helm chart. Pointing at the image's baked config.yaml would
      # tie this file to wherever that image happens to put it, and an explicitly-set path to a
      # missing file is fatal by design.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Compose fixes this container's environment when `docker compose up` starts, before
      # zitadel-init has generated the client IDs and the login service token. The API therefore
      # reads .env itself when it starts, by which time zitadel-init has finished (see depends_on),
      # and the values in the file win. That is what makes a single `docker compose up -d` enough.
      STACKWEAVER_ENV_FILE: /config/stackweaver/.env
      # Database. These must track the postgres service's own POSTGRES_* values - with no config
      # file in play, environment variables are the API's only source for them.
      DATABASE_HOST: postgres
      DATABASE_USER: ${POSTGRES_USER:-iac}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-iac_password}
      DATABASE_NAME: ${POSTGRES_DB:-iac_platform}
      REDIS_HOST: redis
      ZITADEL_ISSUER: ${ZITADEL_ISSUER:-http://localhost:8080}
      ZITADEL_API_CLIENT_ID: ${ZITADEL_API_CLIENT_ID:-}
      ZITADEL_API_CLIENT_SECRET: ${ZITADEL_API_CLIENT_SECRET:-}
      ZITADEL_LOGIN_SERVICE_USER_TOKEN: ${ZITADEL_LOGIN_SERVICE_USER_TOKEN:-}
      ZITADEL_INTERNAL_ADDR: zitadel:8080
      # The bootstrap admin's email, the same literal zitadel-init receives: the API declares it
      # the first platform administrator unless STACKWEAVER_PLATFORM_ADMINS is set in sso.env.
      ZITADEL_ADMIN_USERNAME: admin@ZITADEL.localhost
      # The auth proxy reaches Zitadel as zitadel:8080, a Host no instance domain matches, so it
      # names the instance with this header. Compose assembles it here from ZITADEL_EXTERNAL_HOST,
      # so that key must hold your ExternalDomain in .env before the first start (.env.example
      # ships localhost); it also makes IdP callbacks use that domain.
      CUSTOM_REQUEST_HEADERS: "x-zitadel-instance-host:${ZITADEL_EXTERNAL_HOST:-}"
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      ZITADEL_WEBHOOK_IDP_SYNC_KEY: ${ZITADEL_WEBHOOK_IDP_SYNC_KEY:-}
      ZITADEL_WEBHOOK_COMPLEMENT_TOKEN_KEY: ${ZITADEL_WEBHOOK_COMPLEMENT_TOKEN_KEY:-}
      STACKWEAVER_APP_URL: ${STACKWEAVER_APP_URL:-http://localhost:5173}
      ANSIBLE_ENCRYPTION_KEY: ${ENCRYPTION_KEY:-00000000000000000000000000000000}
      # Storage (Garage S3-compatible)
      STORAGE_BACKEND: s3
      STORAGE_ENDPOINT: garage:3900
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-GK000000000000000000000000}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789}
      STORAGE_BUCKET: stackweaver
      STORAGE_REGION: garage
      STORAGE_USE_SSL: "false"
      STORAGE_FORCE_PATH_STYLE: "true"
      # GitHub App (optional - uncomment and configure to enable)
      # GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      # GITHUB_APP_NAME: ${GITHUB_APP_NAME:-}
      # GITHUB_APP_PRIVATE_KEY_PATH: /etc/github-app-private-key.pem
      # The webhook secret is read from vcs.env; do not set it here.
    volumes:
      # Read at startup through STACKWEAVER_ENV_FILE (see above). The directory is mounted, not
      # the file: an editor that saves by replacing .env would leave a single-file mount pointing
      # at the old copy.
      - .:/config/stackweaver:ro
      # Uncomment to mount GitHub App private key:
      # - ./github-app-private-key.pem:/etc/github-app-private-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zitadel:
        condition: service_started
      zitadel-init:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully
    networks: [stackweaver]
    ports:
      - "8022:8022"  # published for CLI clients and webhooks; the browser reaches the API through the frontend

  # Writes env.js, the frontend's runtime configuration, once zitadel-init has generated the
  # client ID. The frontend image has no shell, so it cannot do this itself.
  frontend-config:
    image: alpine:3.24
    container_name: frontend-config
    # Same user as zitadel-init, so env.js belongs to you like .env does.
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      zitadel-init:
        condition: service_completed_successfully
    restart: "no"
    network_mode: none
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5173/api/v2}
      VITE_ZITADEL_REDIRECT_URI: ${VITE_ZITADEL_REDIRECT_URI:-http://localhost:5173/auth/callback}
    volumes:
      - .:/work
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        client_id="$$(sed -n 's/^ZITADEL_FRONTEND_CLIENT_ID=//p' /work/.env | tail -n 1)"
        if [ -z "$$client_id" ]; then
          echo "ZITADEL_FRONTEND_CLIENT_ID is not in .env: zitadel-init has not written it" >&2
          exit 1
        fi
        # Docker leaves a directory here if the frontend was ever started before this file
        # existed; it has to go before the file can be written.
        if [ -d /work/env.js ]; then rmdir /work/env.js; fi
        # Written in place (no rename), so a running frontend's mount keeps pointing at it.
        cat > /work/env.js << EOF
        window.__STACKWEAVER__ = {
          VITE_API_URL: "$$VITE_API_URL",
          VITE_ZITADEL_CLIENT_ID: "$$client_id",
          VITE_ZITADEL_REDIRECT_URI: "$$VITE_ZITADEL_REDIRECT_URI",
        };
        EOF
        chmod 644 /work/env.js
        echo "wrote env.js for client $$client_id"

  frontend:
    image: ghcr.io/vhco-pro/stackweaver-frontend:latest
    container_name: frontend
    restart: unless-stopped
    volumes:
      # Runtime configuration, written by frontend-config. Short syntax on purpose: it is
      # resolved when this container starts, after frontend-config has run.
      - ./env.js:/usr/share/nginx/html/env.js:ro
      # Serves the API under this origin; see the file for why.
      - ./frontend-proxy.conf:/etc/nginx/stackweaver.d/api-proxy.conf:ro
    depends_on:
      frontend-config:
        condition: service_completed_successfully
      api:
        condition: service_started
    networks: [stackweaver]
    ports:
      - "5173:8080"  # published: this is the app itself (the image listens on 8080)

  orchestrator:
    image: ghcr.io/vhco-pro/stackweaver-orchestrator:latest
    container_name: orchestrator
    restart: unless-stopped
    env_file:
      - ./.env
      - ./vcs.env
    environment:
      # Neither binary reads a config file, so no CONFIG_PATH here; the database credentials
      # below must track the postgres service's own POSTGRES_* values.
      DATABASE_HOST: postgres
      DATABASE_USER: ${POSTGRES_USER:-iac}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-iac_password}
      DATABASE_NAME: ${POSTGRES_DB:-iac_platform}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      # GitHub App (optional - uncomment and configure to enable)
      # GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      # GITHUB_APP_NAME: ${GITHUB_APP_NAME:-}
      # GITHUB_APP_PRIVATE_KEY_PATH: /etc/github-app-private-key.pem
    # Uncomment to mount GitHub App private key:
    # volumes:
    #   - ./github-app-private-key.pem:/etc/github-app-private-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks: [stackweaver]

  runner:
    image: ghcr.io/vhco-pro/stackweaver-opentofu-runner:latest
    container_name: runner
    restart: unless-stopped
    env_file:
      - ./.env
      - ./oidc.env
    environment:
      # Neither binary reads a config file, so no CONFIG_PATH here; the database credentials
      # below must track the postgres service's own POSTGRES_* values.
      DATABASE_HOST: postgres
      DATABASE_USER: ${POSTGRES_USER:-iac}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-iac_password}
      DATABASE_NAME: ${POSTGRES_DB:-iac_platform}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      # Storage (Garage S3-compatible)
      STORAGE_BACKEND: s3
      STORAGE_ENDPOINT: garage:3900
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-GK000000000000000000000000}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789}
      STORAGE_BUCKET: stackweaver
      STORAGE_REGION: garage
      STORAGE_USE_SSL: "false"
      STORAGE_FORCE_PATH_STYLE: "true"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-00000000000000000000000000000000}
    volumes:
      - runner-workspaces:/home/stackweaver/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
      orchestrator:
        condition: service_started
    networks: [stackweaver]

  ansible-runner:
    image: ghcr.io/vhco-pro/stackweaver-ansible-runner:latest
    container_name: ansible-runner
    restart: unless-stopped
    env_file:
      - ./.env
      - ./vcs.env
      - ./oidc.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER:-iac}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-iac_password}
      DATABASE_NAME: ${POSTGRES_DB:-iac_platform}
      # Storage (Garage S3-compatible)
      STORAGE_BACKEND: s3
      STORAGE_ENDPOINT: garage:3900
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-GK000000000000000000000000}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789}
      STORAGE_BUCKET: stackweaver
      STORAGE_REGION: garage
      STORAGE_USE_SSL: "false"
      STORAGE_FORCE_PATH_STYLE: "true"
      # Required: the runner refuses to start with a missing or all-zero key.
      # Compose fails fast here until ENCRYPTION_KEY is set in .env.
      ANSIBLE_ENCRYPTION_KEY: "${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env - generate one with openssl rand -hex 32}"
      WORKSPACES_DIR: /home/stackweaver/workspaces
      # Clean each job's scratch dir (SSH keys, vault passwords, inventory
      # secrets) on completion. Set to "true" only for short-lived debugging.
      ANSIBLE_RUNNER_KEEP_WORKSPACE: "false"
    volumes:
      - ansible-workspaces:/home/stackweaver/workspaces
    # Defense-in-depth: the runner needs no Linux capabilities (Ansible privilege
    # escalation happens on the target host over SSH, not in this container), and
    # a PID cap blunts fork-bomb / runaway-playbook resource exhaustion.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    networks: [stackweaver]
