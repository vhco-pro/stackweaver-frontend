# StackWeaver — Production Docker Compose
# Uses pre-built container images from GHCR (no source code required).
#
# Quick start:
#   1. cp .env.example .env
#   2. docker compose up -d
#   3. Wait for zitadel-init to complete (docker compose logs -f zitadel-init)
#   4. Open http://localhost:5173

volumes:
  postgres_data:
  garage_data:
  garage_meta:
  runner-workspaces:
  zitadel-pat:

services:

  # ── Infrastructure ──────────────────────────────────────────────────

  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iac_password}
      POSTGRES_DB: ${POSTGRES_DB:-iac_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iac} -d ${POSTGRES_DB:-iac_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    network_mode: host

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    network_mode: host

  garage:
    image: dxflrs/garage:v2.2.0
    container_name: garage
    restart: unless-stopped
    volumes:
      - garage_data:/var/lib/garage/data
      - garage_meta:/var/lib/garage/meta
      - ./garage.toml:/etc/garage.toml:ro
    network_mode: host

  garage-init:
    image: alpine:3.23
    container_name: garage-init
    depends_on:
      garage:
        condition: service_started
    restart: "no"
    network_mode: host
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        KEY_ID="$${STORAGE_ACCESS_KEY}"
        KEY_SECRET="$${STORAGE_SECRET_KEY}"

        # Download Garage CLI binary
        ARCH=$$(uname -m)
        wget -qO /usr/local/bin/garage \
          "https://garagehq.deuxfleurs.fr/_releases/v2.2.0/$${ARCH}-unknown-linux-musl/garage"
        chmod +x /usr/local/bin/garage

        # Wait for Garage RPC
        echo "Waiting for Garage..."
        until garage status 2>/dev/null | grep -qi "Hostname"; do sleep 1; done
        echo "Garage is ready"

        # Get node ID
        NODE_ID=$$(garage status 2>/dev/null | grep -v "^=\|^ID" | head -1 | awk '{print $$1}')

        # Assign layout if not yet configured
        CURRENT_VER=$$(garage layout show 2>/dev/null \
          | grep "Current cluster layout version:" | awk '{print $$NF}' || echo "0")
        if [ "$${CURRENT_VER}" = "0" ]; then
          garage layout assign -z dc1 -c 1G "$${NODE_ID}"
          garage layout apply --version 1
        fi

        # Import key, create bucket, grant access (all idempotent)
        garage key import --yes -n stackweaver "$${KEY_ID}" "$${KEY_SECRET}" 2>/dev/null || true
        garage bucket create stackweaver 2>/dev/null || true
        garage bucket allow --read --write --owner stackweaver --key "$${KEY_ID}" 2>/dev/null || true

        echo "Garage initialized successfully"
    environment:
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-GK000000000000000000000000}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789}

  # ── Authentication ──────────────────────────────────────────────────

  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    container_name: zitadel
    restart: unless-stopped
    command: >
      start-from-init
      --config /etc/zitadel/defaults.yaml
      --steps /etc/zitadel/init-steps.yaml
      --masterkey "${ZITADEL_MASTERKEY:-LfcvxoyK4yAwsyp5WYeA3siK61yl7064}"
      --tlsMode external
    env_file:
      - ./.env
    environment:
      ZITADEL_SERVICE_USER_TOKEN: ${ZITADEL_LOGIN_SERVICE_USER_TOKEN:-}
      ZITADEL_DATABASE_POSTGRES_HOST: localhost
      # Post-cutover the login UI is the Stackweaver SPA, served from
      # the frontend container on port 5173. Zitadel's LoginV2.BaseURI
      # points at the SPA's /login route; LoginV2 origin must match the
      # SPA's origin for CORS/CSP to line up.
      ZITADEL_LOGIN_UI_BASE_URL: ${ZITADEL_LOGIN_UI_BASE_URL:-http://localhost:5173/login}
      ZITADEL_LOGIN_UI_ORIGIN: ${ZITADEL_LOGIN_UI_ORIGIN:-http://localhost:5173}
    volumes:
      - ./zitadel-defaults.yaml:/etc/zitadel/defaults.yaml:ro
      - ./zitadel-init-steps.yaml:/etc/zitadel/init-steps.yaml:ro
      - zitadel-pat:/pat
    user: "0"
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: host

  # The standalone `login-ui` container (ghcr.io/zitadel/zitadel-login)
  # was removed in favor of the in-frontend custom login UI bundled
  # with the Stackweaver SPA. The auth proxy in the API container
  # (`/auth/*` routes) handles all Zitadel session API calls and OIDC
  # endpoint forwarding. The `login-ui-service` Zitadel machine user
  # and its PAT are still provisioned by zitadel-init below — they're
  # consumed by the auth proxy + TOTP service + Zitadel webhook handler
  # in the API container under the env var ZITADEL_LOGIN_SERVICE_USER_TOKEN.

  zitadel-init:
    image: ghcr.io/vhco-pro/stackweaver-zitadel-init:latest
    container_name: zitadel-init
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - ./.env
      - ./sso.env
    environment:
      # ZITADEL_ISSUER is the OIDC issuer URL the SPA points at. Post-
      # cutover this drops the legacy `/ui/v2/login` suffix because the
      # Stackweaver SPA serves login at `/login/*` instead of the
      # hosted Zitadel UI's `/ui/v2/login/*`.
      ZITADEL_ISSUER: ${ZITADEL_ISSUER:-http://localhost:8080}
      ZITADEL_INTERNAL_ADDR: localhost:8080
      ZITADEL_DOMAIN: ${ZITADEL_EXTERNAL_HOST:-localhost}
      PROJECT_ROOT: /config
      ZITADEL_ADMIN_USERNAME: admin@ZITADEL.localhost
      ZITADEL_ADMIN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:-Password1!}
      ZITADEL_PAT_PATH: /pat/admin.pat
      ZITADEL_PAT: ${ZITADEL_PAT:-}
      ZITADEL_CUSTOM_DOMAINS: ${ZITADEL_CUSTOM_DOMAINS:-}
    volumes:
      - .:/config/deploy
      - zitadel-pat:/pat:ro
    depends_on:
      zitadel:
        condition: service_started
    restart: "no"
    network_mode: host

  # ── Application ─────────────────────────────────────────────────────

  api:
    image: ghcr.io/vhco-pro/stackweaver-api:latest
    container_name: api
    restart: unless-stopped
    env_file:
      - ./.env
      - ./sso.env
      - ./vcs.env
      - ./oidc.env
    environment:
      CONFIG_PATH: /etc/iac/config/config.yaml
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ZITADEL_ISSUER: ${ZITADEL_ISSUER:-http://localhost:8080}
      ZITADEL_API_CLIENT_ID: ${ZITADEL_API_CLIENT_ID:-}
      ZITADEL_API_CLIENT_SECRET: ${ZITADEL_API_CLIENT_SECRET:-}
      ZITADEL_LOGIN_SERVICE_USER_TOKEN: ${ZITADEL_LOGIN_SERVICE_USER_TOKEN:-}
      ZITADEL_INTERNAL_ADDR: localhost:8080
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      ZITADEL_WEBHOOK_IDP_SYNC_KEY: ${ZITADEL_WEBHOOK_IDP_SYNC_KEY:-}
      ZITADEL_WEBHOOK_COMPLEMENT_TOKEN_KEY: ${ZITADEL_WEBHOOK_COMPLEMENT_TOKEN_KEY:-}
      STACKWEAVER_APP_URL: ${STACKWEAVER_APP_URL:-http://localhost:5173}
      ANSIBLE_ENCRYPTION_KEY: ${ENCRYPTION_KEY:-00000000000000000000000000000000}
      # Storage (Garage S3-compatible)
      STORAGE_BACKEND: s3
      STORAGE_ENDPOINT: localhost:3900
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-GK000000000000000000000000}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789}
      STORAGE_BUCKET: stackweaver
      STORAGE_REGION: garage
      STORAGE_USE_SSL: "false"
      STORAGE_FORCE_PATH_STYLE: "true"
      # GitHub App (optional — uncomment and configure to enable)
      # GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      # GITHUB_APP_NAME: ${GITHUB_APP_NAME:-}
      # GITHUB_APP_PRIVATE_KEY_PATH: /etc/github-app-private-key.pem
      # GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    # Uncomment to mount GitHub App private key:
    # volumes:
    #   - ./github-app-private-key.pem:/etc/github-app-private-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zitadel:
        condition: service_started
      zitadel-init:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8022/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    network_mode: host

  frontend:
    image: ghcr.io/vhco-pro/stackweaver-frontend:latest
    container_name: frontend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8022/api/v2}
      VITE_ZITADEL_ISSUER: ${VITE_ZITADEL_ISSUER:-http://localhost:8080}
      VITE_ZITADEL_CLIENT_ID: ${ZITADEL_FRONTEND_CLIENT_ID:-}
      VITE_ZITADEL_REDIRECT_URI: ${VITE_ZITADEL_REDIRECT_URI:-http://localhost:5173/auth/callback}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Generate env.js with runtime configuration
        cat > /usr/share/nginx/html/env.js << EOF
        window.__STACKWEAVER__ = {
          VITE_API_URL: "$$VITE_API_URL",
          VITE_ZITADEL_ISSUER: "$$VITE_ZITADEL_ISSUER",
          VITE_ZITADEL_CLIENT_ID: "$$VITE_ZITADEL_CLIENT_ID",
          VITE_ZITADEL_REDIRECT_URI: "$$VITE_ZITADEL_REDIRECT_URI",
        };
        EOF
        # Change nginx listen port from 80 to 5173
        sed -i 's/listen 80/listen 5173/' /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    depends_on:
      api:
        condition: service_started
      zitadel:
        condition: service_started
      zitadel-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    network_mode: host

  orchestrator:
    image: ghcr.io/vhco-pro/stackweaver-orchestrator:latest
    container_name: orchestrator
    restart: unless-stopped
    env_file:
      - ./.env
      - ./vcs.env
    environment:
      CONFIG_PATH: /etc/iac/config/config.yaml
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      # GitHub App (optional — uncomment and configure to enable)
      # GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      # GITHUB_APP_NAME: ${GITHUB_APP_NAME:-}
      # GITHUB_APP_PRIVATE_KEY_PATH: /etc/github-app-private-key.pem
    # Uncomment to mount GitHub App private key:
    # volumes:
    #   - ./github-app-private-key.pem:/etc/github-app-private-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    network_mode: host

  runner:
    image: ghcr.io/vhco-pro/stackweaver-runner:latest
    container_name: runner
    restart: unless-stopped
    env_file:
      - ./.env
      - ./oidc.env
    environment:
      CONFIG_PATH: /etc/iac/config/config.yaml
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      # Storage (Garage S3-compatible)
      STORAGE_BACKEND: s3
      STORAGE_ENDPOINT: localhost:3900
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-GK000000000000000000000000}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789}
      STORAGE_BUCKET: stackweaver
      STORAGE_REGION: garage
      STORAGE_USE_SSL: "false"
      STORAGE_FORCE_PATH_STYLE: "true"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-00000000000000000000000000000000}
    volumes:
      - runner-workspaces:/home/iac/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
      orchestrator:
        condition: service_started
    network_mode: host

  ansible-runner:
    image: ghcr.io/vhco-pro/stackweaver-ansible-runner:latest
    container_name: ansible-runner
    restart: unless-stopped
    env_file:
      - ./.env
      - ./vcs.env
      - ./oidc.env
    environment:
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER:-iac}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-iac_password}
      DATABASE_NAME: ${POSTGRES_DB:-iac_platform}
      # Storage (Garage S3-compatible)
      STORAGE_BACKEND: s3
      STORAGE_ENDPOINT: localhost:3900
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-GK000000000000000000000000}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789}
      STORAGE_BUCKET: stackweaver
      STORAGE_REGION: garage
      STORAGE_USE_SSL: "false"
      STORAGE_FORCE_PATH_STYLE: "true"
      ANSIBLE_ENCRYPTION_KEY: ${ENCRYPTION_KEY:-00000000000000000000000000000000}
      WORKSPACES_DIR: /home/iac/workspaces
      ANSIBLE_RUNNER_KEEP_WORKSPACE: "true"
    volumes:
      - runner-workspaces:/home/iac/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    network_mode: host
