# https://github.com/zitadel/zitadel/blob/main/cmd/defaults.yaml
# Change these values when using a custom domain with a reverse proxy.
ExternalDomain: localhost
ExternalPort: 8080
ExternalSecure: false
TLS:
  Enabled: false

Database:
  Postgres:
    Host: localhost
    Port: 5432
    Database: zitadel
    Admin:
      Username: iac
      Password: iac_password
      SSL:
        Mode: disable
    User:
      Username: iac
      Password: iac_password
      SSL:
        Mode: disable

DefaultInstance:
  LoginPolicy:
    AllowUsernamePassword: true
    AllowExternalIDPs: true
  Org:
    LoginPolicy:
      AllowUsernamePassword: true
  Features:
    LoginDefaultOrg: true
    LoginV2:
      Required: true
      BaseURI: http://localhost:3000/ui/v2/login # point to login UI
  # OIDC Settings - Configure token lifetimes and format
  # Note: Token format (JWT vs opaque) is typically controlled at the application level
  # but these settings apply to all OIDC applications in the instance
  OIDCSettings:
    AccessTokenLifetime: 12h
    IdTokenLifetime: 12h
    # 720h are 30 days
    RefreshTokenIdleExpiration: 720h
    # 2160h are 90 days
    RefreshTokenExpiration: 2160h

