# Serves the StackWeaver API under the frontend's own origin, so the browser only ever talks to
# one address (http://localhost:5173 by default).
#
# The frontend's Content-Security-Policy allows calls to its own origin only, which is what a
# Kubernetes ingress gives it by routing the app and the API under one hostname. This file does
# the same job for Docker Compose: the frontend's nginx includes it at server scope (it is
# mounted into /etc/nginx/stackweaver.d/) and forwards the API's paths to the api service.
# The routes mirror the chart's ingress.

# Docker's embedded DNS. Resolving at request time keeps the proxy working after the api
# container is recreated with a new address.
resolver 127.0.0.11 valid=10s ipv6=off;
set $stackweaver_api http://api:8022;

proxy_http_version 1.1;
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $http_host;
# Run logs are streamed; do not hold them back.
proxy_buffering off;
proxy_read_timeout 300s;

# `^~` keeps the image's static-asset rule from claiming an API path that ends in .js or .json.
location ^~ /api/v2 {
    # Configuration and state uploads are larger than the frontend's own limit.
    client_max_body_size 100m;
    proxy_pass $stackweaver_api;
}

# The two auth routes that belong to the single-page app, not to the API.
location ^~ /auth/callback {
    try_files $uri /index.html;
}
location ^~ /auth/login {
    try_files $uri /index.html;
}

location ^~ /auth {
    proxy_pass $stackweaver_api;
}

location = /.well-known/terraform.json {
    proxy_pass $stackweaver_api;
}
location = /.well-known/openid-configuration {
    proxy_pass $stackweaver_api;
}
location = /.well-known/jwks {
    proxy_pass $stackweaver_api;
}

location ^~ /v1/modules {
    proxy_pass $stackweaver_api;
}
