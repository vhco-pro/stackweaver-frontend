# Security headers for the Stackweaver frontend.
#
# Included at server scope AND inside every location that declares its own
# add_header, because nginx's add_header inheritance is all-or-nothing: a level
# that sets any add_header drops ALL headers inherited from parent levels. Without
# re-including here, static assets / env.js / health would lose these headers.
#
# Keep in sync with the backend auth-proxy middleware
# (backend/internal/api/middleware/security_headers.go). The CSP script-src hash
# below is the SHA-256 of the inline theme script in index.html — recompute it if
# that script changes (see docs/internal/plans/security/frontend-security-headers-csp-hardening-plan.md).

add_header X-Frame-Options              "SAMEORIGIN"                          always;
add_header X-Content-Type-Options       "nosniff"                             always;
add_header Referrer-Policy              "strict-origin-when-cross-origin"     always;
add_header X-XSS-Protection             "0"                                   always;
add_header Cross-Origin-Opener-Policy   "same-origin"                         always;
add_header Cross-Origin-Resource-Policy "same-origin"                         always;
add_header Permissions-Policy           "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy       "default-src 'self'; script-src 'self' 'sha256-lYhCncyoaQCBTA70cCGOOyDxk/+gZOdBcrhbZykuNPA='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
